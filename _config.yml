# ──────────────────────────────────────────────
#  AIBIQuery — GitHub Pages Configuration
#  Jekyll _config.yml
# ──────────────────────────────────────────────

# --------------------------
# Site Identity
# --------------------------
title: "AIBIQuery"
tagline: "Enterprise Analytics Powered by AI"
description: >
  A complete data intelligence platform for the Data Science & Analytics Community.
  52+ features, 10+ ML algorithms, 100% AI-powered.
url: "https://aibiquery.github.io"
baseurl: "/platform-docs/"
logo: "/assets/images/AIBIQuery-logo.jpg"

# --------------------------
# Author
# --------------------------
author:
  name: "AIBIQuery Team"
  email: "postmaster@aibiquery.com"
  url: "https://aibiquery.com"

# --------------------------
# Theme
# --------------------------
# Using the official GitHub Pages supported theme: Just the Docs
# Docs: https://just-the-docs.github.io/just-the-docs/
remote_theme: just-the-docs/just-the-docs

# Color scheme: "light" or "dark"
color_scheme: light

# --------------------------
# Navigation
# --------------------------
nav_sort: case_insensitive

# --------------------------
# Search
# --------------------------
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# --------------------------
# Footer
# --------------------------
footer_content: >
  &copy; 2026 AIBIQuery &mdash; Enterprise Analytics Platform.
  Built with <a href="https://pages.github.com">GitHub Pages</a>.

# --------------------------
# Navigation Structure
# (controls sidebar order and labels)
# --------------------------
just_the_docs:
  collections:
    docs:
      name: Documentation
      nav_exclude: false

# --------------------------
# Plugins (GitHub Pages safe)
# --------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# --------------------------
# Markdown & Syntax
# --------------------------
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# --------------------------
# Exclude from build
# --------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.sh"
  - README_DEV.md
